{% extends "base.html" %}
{% block title %}Ajouter un Colis - Gestion des Colis{% endblock %}
{% block content %}
    <h2 class="text-2xl mb-4">Ajouter un Colis</h2>
    {% if error %}
        <p class="text-red-500">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('ajouter_colis') }}" method="post" class="max-w-md">
        <div class="mb-4">
            <label for="destinataire" class="block text-gray-700">Destinataire</label>
            <input type="text" id="destinataire" name="destinataire" required class="w-full p-2 border rounded">
        </div>
        <div class="mb-4">
            <label for="adresse" class="block text-gray-700">Adresse</label>
            <input type="text" id="adresse" name="adresse" required class="w-full p-2 border rounded">
        </div>
        <div class="mb-4">
            <label for="poids" class="block text-gray-700">Poids (kg)</label>
            <input type="number" id="poids" name="poids" step="0.1" required class="w-full p-2 border rounded">
        </div>
        <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">Ajouter</button>
        <a href="{{ url_for('index') }}" class="ml-2 inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Retour</a>
    </form>
{% endblock %}
