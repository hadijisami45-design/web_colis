version: '3.8'

services:


  api :
    build :
      context: ./API
      dockerfile: dockerfile
    networks: 
      - backend
    ports :
      - "8007:8007"
    depends_on :
      - mongo


  affichage:
    build :  
      context: ./API/Affichage  
      dockerfile: dockerfile
    container_name: affichage
    networks:
      - backend
    ports:
      - "8000:8000"
    depends_on:
      - mongo



  ajouter:
    build: 
      context: ./API/Ajouter 
      dockerfile: dockerfile
    container_name: ajouter
    networks:
      - backend
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    


  
  mongo:
    image: mongo:latest
    container_name: mongodb
    networks :
      - backend
      - base
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"



  auth:
    build:       
      context: ./API/Auth
      dockerfile: dockerfile
    container_name: auth
    networks:
      - backend
    ports:
      - "8002:8002"
    depends_on:
      - mongo
  



  flask:
    build:
      context: ./flask_app
      dockerfile: dockerfile
    container_name: flask
    networks:
      - backend
    ports:
      - "5001:5001"
    depends_on:
      - mongo
      - auth


volumes:
  mongo_data:


networks:
  backend:
  base:


