version: '3.8'

services:
  affichage:
    build :  
      context: ./Affichage  
      dockerfile: dockerfile
    container_name: affichage
    networks:
      - backend
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  ajouter:
    build: 
      context: ./Ajouter 
      dockerfile: dockerfile
    container_name: ajouter
    networks:
      - backend
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    
  
  mongo:
    image: mongo:latest
    container_name: mongodb
    networks :
      - backend
      - base
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  auth:
    build:       
      context: ./Auth
      dockerfile: dockerfile
    container_name: auth
    networks:
      - backend
    ports:
      - "8002:8002"
    depends_on:
      - mongo


volumes:
  mongo_data:


networks:
  backend:
  base:

