apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: colis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: your-registry/web:latest
        ports:
        - containerPort: 5001
        env:
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGO_URI
        - name: API_AFFICHAGE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_AFFICHAGE_URL
        - name: API_AJOUTER_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_AJOUTER_URL
        - name: API_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_AUTH_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: colis-app
spec:
  selector:
    app: web
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: web-loadbalancer
  namespace: colis-app
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer