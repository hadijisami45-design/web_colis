apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: colis-app-ingress
  namespace: colis-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-loadbalancer
            port:
              number: 80