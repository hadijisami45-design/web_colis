apiVersion: apps/v1
kind: Deployment
metadata:
  name: affichage
  namespace: colis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: affichage
  template:
    metadata:
      labels:
        app: affichage
    spec:
      containers:
      - name: affichage
        image: your-registry/affichage:latest
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGO_URI
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: affichage-service
  namespace: colis-app
spec:
  selector:
    app: affichage
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP