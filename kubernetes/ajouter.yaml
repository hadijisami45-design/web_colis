apiVersion: apps/v1
kind: Deployment
metadata:
  name: ajouter
  namespace: colis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ajouter
  template:
    metadata:
      labels:
        app: ajouter
    spec:
      containers:
      - name: ajouter
        image: your-registry/ajouter:latest
        ports:
        - containerPort: 8001
        env:
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGO_URI
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ajouter-service
  namespace: colis-app
spec:
  selector:
    app: ajouter
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP